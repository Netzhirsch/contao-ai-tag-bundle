services:
    _defaults:
        autoconfigure: true
        autowire: true

    Netzhirsch\ContaoAiTagBundle\:
        resource: '../src/'
        exclude:
            - '../src/NetzhirschContaoAiTagBundle.php'
            - '../src/ContaoManager/'
            - '../src/Image/AiTagOptions.php'
            - '../src/Security/ContaoAiTagPermissions.php'
            - '../src/Audit/AuditActor.php'
            # Backend-Module erzeugt Contao selbst; als Service wuerde das Autowiring am
            # DataContainer-Parameter des Konstruktors scheitern.
            - '../src/Backend/Module/'
            # Optional, siehe services_mcp.yaml
            - '../src/Mcp/'
            # Versionsabhaengig, siehe services_detection_*.yaml
            - '../src/EventListener/DetectAiSourceListener.php'
            - '../src/EventListener/DetectAiSourceOnUploadListener.php'

    Netzhirsch\ContaoAiTagBundle\Image\FontLocator:
        arguments:
            $configuredPath: '%netzhirsch_contao_ai_tag.font_path%'

    # Buendelt das Aussehen. Der Fingerabdruck dieses Objekts geht in den
    # Cache-Schluessel ein, damit Design-Aenderungen bereits erzeugte Bilder
    # invalidieren.
    Netzhirsch\ContaoAiTagBundle\Image\TagStyle:
        arguments:
            $style: '%netzhirsch_contao_ai_tag.style%'
            $textColor: '%netzhirsch_contao_ai_tag.text_color%'
            $boxColor: '%netzhirsch_contao_ai_tag.box_color%'
            $boxOpacity: '%netzhirsch_contao_ai_tag.box_opacity%'
            $cornerRadius: '%netzhirsch_contao_ai_tag.corner_radius%'
            $paddingRatio: '%netzhirsch_contao_ai_tag.padding_ratio%'
            $marginRatio: '%netzhirsch_contao_ai_tag.margin_ratio%'
            $uppercase: '%netzhirsch_contao_ai_tag.uppercase%'
            $minFontSize: '%netzhirsch_contao_ai_tag.min_font_size%'
            $relativeFontSize: '%netzhirsch_contao_ai_tag.relative_font_size%'
            $maxFontSize: '%netzhirsch_contao_ai_tag.max_font_size%'
            $maxBoxWidth: '%netzhirsch_contao_ai_tag.max_box_width%'
            $maxBoxHeight: '%netzhirsch_contao_ai_tag.max_box_height%'
            $minWidth: '%netzhirsch_contao_ai_tag.min_width%'
            $minHeight: '%netzhirsch_contao_ai_tag.min_height%'

    Netzhirsch\ContaoAiTagBundle\Image\TagRenderer:
        arguments:
            $imagine: '@contao.image.imagine'
            $metadataReaderWriter: '@contao.image.metadata'

    Netzhirsch\ContaoAiTagBundle\Image\AiTagResolver:
        arguments:
            $pageFinder: '@contao.routing.page_finder'
            $projectDir: '%kernel.project_dir%'
            $uploadPath: '%contao.upload_path%'
            $excludedPaths: '%netzhirsch_contao_ai_tag.excluded_paths%'

    # Dekoriert statt ersetzt: alle Verbraucher im Core typisieren gegen
    # ResizerInterface bzw. DeferredResizerInterface, nicht gegen die Klasse.
    Netzhirsch\ContaoAiTagBundle\Image\AiTagResizer:
        decorates: contao.image.resizer
        public: true
        arguments:
            $inner: '@.inner'
            $storage: '@contao.image.deferred_image_storage'
            $scopeMatcher: '@contao.routing.scope_matcher'
            $cacheDir: '%contao.image.target_dir%'
            $uploadDir: '%kernel.project_dir%/%contao.upload_path%'
            $tagBackendImages: '%netzhirsch_contao_ai_tag.tag_backend_images%'
            $intermediateQuality: '%netzhirsch_contao_ai_tag.intermediate_quality%'

    Netzhirsch\ContaoAiTagBundle\Twig\AiTagExtension:
        arguments:
            $imagine: '@contao.image.imagine'
            $placement: '%netzhirsch_contao_ai_tag.hint_placement%'
            $separator: '%netzhirsch_contao_ai_tag.hint_separator%'

    Netzhirsch\ContaoAiTagBundle\EventListener\DataContainer\FilesAiTagListener:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Netzhirsch\ContaoAiTagBundle\Detection\AiSourceDetector:
        arguments:
            $metadataReaderWriter: '@contao.image.metadata'

    Netzhirsch\ContaoAiTagBundle\Controller\AiTagLogExportController:
        public: true
        arguments:
            $csrfTokenManager: '@contao.csrf.token_manager'
            $csrfTokenName: '%contao.csrf_token_name%'

    Netzhirsch\ContaoAiTagBundle\EventListener\DataContainer\AiTagLogExportButtonListener:
        arguments:
            $csrfTokenManager: '@contao.csrf.token_manager'
            $csrfTokenName: '%contao.csrf_token_name%'

    Netzhirsch\ContaoAiTagBundle\Detection\AiSourceInspector:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $mode: '%netzhirsch_contao_ai_tag.detection%'

    Netzhirsch\ContaoAiTagBundle\EventListener\DataContainer\AiTagCoverageListener:
        arguments:
            $calculator: '@contao.image.resize_calculator'
            $projectDir: '%kernel.project_dir%'

    Netzhirsch\ContaoAiTagBundle\EventListener\DataContainer\AiTagPreviewListener:
        arguments:
            $imageFactory: '@contao.image.factory'
            $projectDir: '%kernel.project_dir%'
            $imagineOptions: '%contao.image.imagine_options%'

    # Der Kanal "contao" schreibt ueber den ContaoTableHandler nach tl_log
    Netzhirsch\ContaoAiTagBundle\Audit\AiTagAuditLogger:
        arguments:
            $contaoLogger: '@monolog.logger.contao'

    Netzhirsch\ContaoAiTagBundle\Cron\PurgeAiTagLogCron:
        arguments:
            $retentionDays: '%netzhirsch_contao_ai_tag.log_retention_days%'

    # --- Lizenz ---
    # LicenseToken bekommt keinen Konstruktor-Parameter: der oeffentliche Schluessel
    # steht im Code und darf nicht aus der Konfiguration kommen.
    Netzhirsch\ContaoAiTagBundle\License\LicenseStore:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'

    Netzhirsch\ContaoAiTagBundle\License\LicenseGate:
        public: true
        arguments:
            $backendUrl: '%netzhirsch_contao_ai_tag.license_backend_url%'

    # Oeffentlich, weil das Backend-Modul von Contao ausserhalb des Containers
    # erzeugt wird und die Dienste ueber System::getContainer() holt.
    Netzhirsch\ContaoAiTagBundle\License\RenewalClient:
        public: true
        arguments:
            $httpClient: '@http_client'
            $serverUrlOverride: '%netzhirsch_contao_ai_tag.license_server_url%'

    Netzhirsch\ContaoAiTagBundle\EventListener\BillingReturnListener:
        arguments:
            $scopeMatcher: '@contao.routing.scope_matcher'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
