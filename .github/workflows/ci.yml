name: CI

on:
    push:
        branches: [master, main]
    pull_request:
    schedule:
        - cron: '0 13 * * MON'

permissions:
    contents: read

jobs:
    quality:
        name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 8.1 ist der Boden (Contao 5.3 LTS), 8.4 die Spitze.
                php: ['8.1', '8.4']
                dependencies: ['highest']
                include:
                    # Aelteste unterstuetzte Kombination: Contao 5.3 auf PHP 8.1.
                    - php: '8.1'
                      dependencies: 'lowest'

        steps:
            # Ohne diesen Vorabcheck scheitert der Lauf erst spaeter mit einem
            # unverstaendlichen "git clone --mirror ... Authentication failed".
            # Der secrets-Kontext ist in einem step-if nicht erlaubt, deshalb ueber
            # die Step-Umgebung.
            - name: Ensure the token for the private dev dependency exists
              env:
                  COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
              run: |
                  if [ -z "$COMPOSER_GITHUB_TOKEN" ]; then
                      echo "::error::Das Secret COMPOSER_GITHUB_TOKEN fehlt. Es wird gebraucht, um die private Dev-Abhaengigkeit netzhirsch/contao-mcp-bundle zu installieren (PHPStan und die MCP-Tests brauchen deren Basisklasse). Anlegen unter Settings -> Secrets and variables -> Actions."
                      exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: gd, imagick, dom, json, mbstring, pdo_mysql
                  coverage: none

            # netzhirsch/contao-mcp-bundle liegt als require-dev in einem privaten
            # Repository. Ohne Token schlaegt die Installation fehl.
            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'

            - name: Show the resolved Contao version
              run: composer show contao/core-bundle | head -3

            - name: Audit dependencies
              run: composer audit

            - name: Check the coding style
              run: vendor/bin/ecs check --no-progress-bar --ansi

            - name: Analyse the code
              run: vendor/bin/phpstan analyse --no-progress --ansi

            - name: Check for refactorings
              run: vendor/bin/rector process --dry-run --no-progress-bar --ansi

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always
