name: CI

on:
    push:
        branches: [master, main]
    pull_request:
    schedule:
        - cron: '0 13 * * MON'

permissions:
    contents: read

jobs:
    quality:
        name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 8.1 ist der Boden (Contao 5.3 LTS), 8.4 die Spitze.
                php: ['8.1', '8.4']
                dependencies: ['highest']
                include:
                    # Aelteste unterstuetzte Kombination: Contao 5.3 auf PHP 8.1.
                    - php: '8.1'
                      dependencies: 'lowest'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # netzhirsch/contao-mcp-bundle liegt als require-dev in einem privaten
            # Repository. Fehlt das Token, laeuft der Rest trotzdem durch - die
            # MCP-Werkzeuge bleiben dann aber ungeprueft, und das sagt der Lauf auch.
            - name: Detect the private-repo token
              id: mcp
              env:
                  COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
              run: |
                  if [ -n "$COMPOSER_GITHUB_TOKEN" ]; then
                      echo 'available=yes' >> "$GITHUB_OUTPUT"
                      # Nur mit echtem Token setzen: mit leerem Wert versucht Composer
                      # sich anzumelden und GitHub weist JEDEN Download ab.
                      echo "COMPOSER_AUTH={\"github-oauth\":{\"github.com\":\"$COMPOSER_GITHUB_TOKEN\"}}" >> "$GITHUB_ENV"
                  else
                      echo 'available=no' >> "$GITHUB_OUTPUT"
                      echo "::warning title=MCP-Werkzeuge ungeprueft::Das Secret COMPOSER_GITHUB_TOKEN fehlt, deshalb konnte netzhirsch/contao-mcp-bundle nicht installiert werden. src/Mcp und tests/Mcp wurden in diesem Lauf NICHT geprueft. Secret anlegen unter Settings -> Secrets and variables -> Actions."
                  fi

            # composer.json pinnt die Plattform lokal auf PHP 8.1, damit Entwicklung
            # und Untergrenze zusammenpassen. In der CI muss der Pin weg, sonst loest
            # auch der PHP-8.4-Job nur Contao 5.3 auf (5.7 verlangt PHP ^8.3) und die
            # obere Haelfte der Matrix pruefte gar nichts Neues.
            - name: Resolve against the PHP version of this job
              run: composer config --unset platform.php

            - name: Drop the private dev dependency without a token
              if: steps.mcp.outputs.available == 'no'
              run: |
                  composer remove --dev --no-update netzhirsch/contao-mcp-bundle
                  composer config --unset repositories.netzhirsch-mcp

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: gd, imagick, dom, json, mbstring, pdo_mysql, sodium
                  coverage: none

            # COMPOSER_AUTH kommt aus dem Schritt oben und steht nur dann in der
            # Umgebung, wenn es ein Token gibt.
            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - name: Show the resolved Contao version
              run: composer show contao/core-bundle | grep -E '^(name|versions)'

            # Zwei Dateien haengen an optionalen Abhaengigkeiten: src/Mcp am
            # MCP-Bundle, der Dbafs-Listener an Contao ab 5.5. Fehlt eine davon,
            # laufen PHPStan und Rector mit der reduzierten Konfiguration - und der
            # Lauf sagt, was dabei ungeprueft bleibt.
            - name: Decide the analysis scope
              id: scope
              run: |
                  if [ '${{ steps.mcp.outputs.available }}' = 'yes' ] && [ -f vendor/contao/core-bundle/src/Filesystem/Dbafs/DbafsChangeEvent.php ]; then
                      echo 'full=yes' >> "$GITHUB_OUTPUT"
                  else
                      echo 'full=no' >> "$GITHUB_OUTPUT"
                      echo "::warning title=Analyse eingeschraenkt::Optionale Abhaengigkeiten fehlen (MCP-Bundle: ${{ steps.mcp.outputs.available }}, DbafsChangeEvent: $([ -f vendor/contao/core-bundle/src/Filesystem/Dbafs/DbafsChangeEvent.php ] && echo ja || echo nein)). src/Mcp und der Dbafs-Listener wurden nicht analysiert."
                  fi

            # Sicherheitslücken lassen den Lauf scheitern, aufgegebene Pakete nicht:
            # doctrine/annotations kommt transitiv aus dem Contao-Baum und ist nichts,
            # was dieses Bundle beheben koennte.
            - name: Audit dependencies
              run: composer audit --abandoned=report

            # Stil und Refactoring nur im hoechsten Satz: der lowest-Job soll die
            # unterstuetzte Contao-/PHP-Untergrenze pruefen, nicht uralte Fassungen der
            # Werkzeuge selbst - ECS 6.0 kennt ECSConfig::configure() noch nicht.
            - name: Check the coding style
              if: matrix.dependencies == 'highest'
              run: vendor/bin/ecs check --no-progress-bar --ansi

            - name: Analyse the code
              run: vendor/bin/phpstan analyse --no-progress --ansi ${{ steps.scope.outputs.full == 'no' && '--configuration=phpstan-reduced.neon.dist' || '' }}

            - name: Check for refactorings
              if: matrix.dependencies == 'highest'
              run: vendor/bin/rector process --dry-run --no-progress-bar --ansi ${{ steps.scope.outputs.full == 'no' && '--config=rector-reduced.php' || '' }}

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always ${{ steps.mcp.outputs.available == 'no' && '--exclude-group mcp' || '' }}
