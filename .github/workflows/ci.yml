name: CI

on:
    push:
        branches: [master, main]
    pull_request:
    schedule:
        - cron: '0 13 * * MON'

permissions:
    contents: read

jobs:
    quality:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: gd, imagick, dom, json, mbstring, pdo_mysql
                  coverage: none

            - name: Install dependencies
              uses: ramsey/composer-install@v3

            - name: Audit dependencies
              run: composer audit

            - name: Check the coding style
              run: vendor/bin/ecs check --no-progress-bar --ansi

            - name: Analyse the code
              run: vendor/bin/phpstan analyse --no-progress --ansi

            - name: Check for refactorings
              run: vendor/bin/rector process --dry-run --no-progress-bar --ansi

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always
